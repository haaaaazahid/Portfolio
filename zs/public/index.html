<style>

function Cursor(){const x=useMotionValue(-50),y=useMotionValue(-50),sx=useSpring(x,{stiffness:500,damping:30}),sy=useSpring(y,{stiffness:500,damping:30}),[big,setBig]=useState(false),[on,setOn]=useState(false);
useEffect(()=>{if(!matchMedia("(pointer:fine)").matches)return;setOn(true);document.body.classList.add("cur");

const f=i=>rm||!o?1:o===i?1.5:.7;
return <div><div className="split"><div className="nm"><b>MOHD ZAHID SHAIKH</b>Two worlds. One identity.</div>
<motion.a href="#coach" className="door c" animate={{flexGrow:f(1)}} transition={{duration:.7,ease:E}} style={{flexBasis:0}} onMouseEnter={()=>setO(1)} onMouseLeave={()=>setO(0)} onFocus={()=>setO(1)} onBlur={()=>setO(0)}><h2>The<br/>Coach</h2><p>Calisthenics and kickboxing. Strength, movement and discipline, taught.</p><span className="go">Enter the coach world</span></motion.a>
<motion.a href="#developer" className="door d" animate={{flexGrow:f(2)}} transition={{duration:.7,ease:E}} style={{flexBasis:0}} onMouseEnter={()=>setO(2)} onMouseLeave={()=>setO(0)} onFocus={()=>setO(2)} onBlur={()=>setO(0)}><h2>The<br/>Developer</h2><p>Full-stack web development, and the founder of Zhub.</p><span className="go">Enter the developer world</span></motion.a></div>

<Reveal d={.1}><Magnetic><a className="btn" href="#contact">Get in touch</a></Magnetic></Reveal></div></div>}

<Marquee items={["Calisthenics","Kickboxing","Strength","Mobility","Skill"]}/>

<div className="sec"><h2 className="t">Specialities</h2><Cells a={[["Calisthenics","Bodyweight skill and strength."],["Kickboxing","Technique, combinations, conditioning."],["Strength and conditioning","A strong base."],["Mobility and flexibility","Range that supports skills."],["Bodyweight strength","Pull, push, hold."],["Skill development","Progressions, step by step."]]}/></div>
<div className="sec"><h2 className="t">Movement library</h2><Reveal><ul className="moves">{["Pull-ups","Muscle-up progressions","Front lever progressions","Back lever","Handstand","L-sit","Dips","Push-ups","Kickboxing combinations"].map(m=><li key={m}>{m}</li>)}</ul></Reveal></div>
<div className="sec"><h2 className="t">Achievements</h2><Cells a={[["Kickboxing gold medal","District level."],["NCC Company Sergeant Major","Leadership role."],["NCC B and C certificates","Names and dates to be added."]]}/></div>

<Gallery/><div className="sec"><Magnetic><a className="btn" href="#contact">Enquire about coaching</a></Magnetic></div></div></div>}
function Dev(){const P=useApi("/api/projects");
const S={Frontend:["HTML","CSS","JavaScript","React","Next.js","TypeScript"],Backend:["Node.js","Express","REST APIs"],Databases:["MySQL","Supabase","Firebase"],Tools:["Git","GitHub","VS Code","Vercel"],Other:["AI-assisted development","Responsive design","UI/UX implementation","Product prototyping"]};
return <div><div className="wrap"><div className="hero"><Words as="h1" text="I build digital experiences and products."/><Reveal d={.5}><p className="lead">Software development, creative problem-solving and the process of turning ideas into functional digital products.</p></Reveal></div></div>
<Marquee items={["React","Node.js","JavaScript","TypeScript","Supabase","MySQL","Framer Motion"]}/>
<div className="wrap"><div className="sec"><h2 className="t">Background</h2><Reveal><p style={{maxWidth:"60ch"}}>BSc Computer Science, Royal College of Arts, Science and Commerce (Autonomous). Graduating 2026, CGPI 6.95. Interests: full-stack, frontend and backend development, databases and AI-assisted development.</p></Reveal></div>
<div className="sec"><h2 className="t">Skills</h2>{Object.entries(S).map(([k,v])=><Reveal key={k}><p><b>{k}</b><br/>{v.map(t=><span className="tag" key={t}>{t}</span>)}</p></Reveal>)}</div>
<div className="sec"><h2 className="t">Selected projects</h2>{P.map(p=>{const n=p.title,s=p.status,d=p.description,t=p.tags||[];return <Reveal key={p.id}><article className="case">{p.cover?<img src={p.cover} alt={n+" cover"} loading="lazy" style={{width:"100%",aspectRatio:"4/3",objectFit:"cover"}}/>:<div className="cover">No cover image yet</div>}<div><h3>{n}</h3><b style={{color:"var(--acc)",fontSize:13}}>Status: {s}</b><p>{d}</p>{t.map(x=><span className="tag" key={x}>{x}</span>)}<p>{p.liveUrl&&<a href={p.liveUrl} target="_blank" rel="noopener noreferrer">Live site</a>}{p.liveUrl&&p.githubUrl&&" · "}{p.githubUrl&&<a href={p.githubUrl} target="_blank" rel="noopener noreferrer">GitHub</a>}</p></div></article></Reveal>})}{!P.length&&<span className="note">No published projects yet.</span>}</div>
<div className="sec"><h2 className="t">Beyond code. Building ideas.</h2><p>I’m the founder of Zhub, part of my developer work.</p><Magnetic><a className="btn" href="#zhub">Read about Zhub</a></Magnetic></div></div></div>}
function Zhub(){return <div className="wrap"><div className="hero"><a href="#developer">Back to Developer</a><Words as="h1" text="Zhub. Building ideas."/><Reveal d={.4}><p className="lead">Founder: Mohd Zahid Shaikh.</p></Reveal></div><div className="sec"><span className="note">Vision, mission, product direction, milestones and updates not yet provided. Nothing about users, revenue or funding is claimed.</span></div></div>}
function useApi(u){const[d,s]=useState([]);useEffect(()=>{fetch(u).then(r=>r.json()).then(s).catch(()=>{})},[u]);return d}
const tok=()=>sessionStorage.getItem("t")||"";
const api=(u,o={})=>fetch(u,{...o,headers:{...(o.headers||{}),Authorization:"Bearer "+tok()}}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed.");return j});
const JSONH={"Content-Type":"application/json"};
const CATS=["Calisthenics","Kickboxing","Strength","Mobility","Training"];
function Gallery(){const g=useApi("/api/gallery");const[c,setC]=useState("All");const[o,setO]=useState(null);const cats=["All",...new Set(g.map(x=>x.category))];const v=g.filter(x=>c==="All"||x.category===c);

<div className="gal">{v.map((x,i)=><motion.button key={x.id} initial={{opacity:0,scale:.94}} whileInView={{opacity:1,scale:1}} viewport={{once:true}} transition={{duration:.5,delay:(i%6)*.05}} onClick={()=>setO(x)} aria-label={"Open "+(x.caption||x.category)}><img loading="lazy" src={x.src} alt={x.alt||x.caption||x.category}/></motion.button>)}</div></>}
<AnimatePresence>{o&&<motion.div className="lb" role="dialog" aria-label="Image viewer" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} onClick={()=>setO(null)}><img src={o.src} alt={o.alt||o.caption||o.category}/><button className="btn" autoFocus onClick={()=>setO(null)}>Close</button></motion.div>}</AnimatePresence></div>}
function Contact(){const[st,setSt]=useState("");const send=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));setSt("sending");try{await api("/api/contact",{method:"POST",headers:JSONH,body:JSON.stringify(f)});setSt("done");e.target.reset()}catch(x){setSt("Error: "+x.message)}};

{tab==="Projects"?<AdminProjects/>:tab==="Gallery"?<AdminGallery/>:<AdminMail/>}</div>}
function useList(u){const[d,s]=useState([]);const[e,setE]=useState("");const r=()=>api(u).then(s).catch(x=>{setE(x.message);if(x.message.startsWith("Sign"))sessionStorage.removeItem("t")});useEffect(()=>{r()},[]);return[d,r,e]}
function AdminProjects(){const[l,r,e]=useList("/api/projects?all=1");const[ed,setEd]=useState(null);const[m,setM]=useState("");

{l.map(p=><div key={p.id} className="cell"><h3>{p.title} <small>{p.published?"Published":"Draft"}</small></h3><button className="tag" style={{background:"none",color:"inherit"}} onClick={()=>setEd(p)}>Edit</button><button className="tag" style={{background:"none",color:"inherit"}} onClick={()=>act(()=>{const f=new FormData();f.set("title",p.title);f.set("status",p.status);f.set("description",p.description);f.set("tags",p.tags.join(","));f.set("liveUrl",p.liveUrl||"");f.set("githubUrl",p.githubUrl||"");f.set("published",!p.published);return api("/api/projects/"+p.id,{method:"PUT",body:f})},p.published?"Unpublished.":"Published.")}>{p.published?"Unpublish":"Publish"}</button><button className="tag" style={{background:"none",color:"inherit"}} onClick={()=>confirm("Delete “"+p.title+"”?")&&act(()=>api("/api/projects/"+p.id,{method:"DELETE"}),"Deleted.")}>Delete</button></div>)}</div>}
